# The shared base every extension's entrypoint contract inherits, its tests, and the mock
# FlareTeeManager extensions test against. Extensions remap sol/ in and pin these dependencies
# at the same versions; make lint checks it.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["dependencies"]
solc = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin-contracts/=dependencies/@openzeppelin-contracts-5.7.0/",
    "flare-periphery/=dependencies/flare-periphery-0.1.53/",
    "forge-std/=dependencies/forge-std-1.17.0/",
]

[fmt]
# Flare's style: import { X }
bracket_spacing = true

[soldeer]
# stable import names: a version bump touches only this file and soldeer.lock
remappings_version = false
remappings_location = "config"

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
flare-periphery = "0.1.53"
forge-std = "1.17.0"
